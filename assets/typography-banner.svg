<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#07101e" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base with Grid -->
  <rect width="900" height="200" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="900" height="200" rx="16" fill="url(#techGrid)" />

  <!-- Cybernetic Corner Accents -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#10B981" stroke-width="3" />
  <path d="M 884 35 L 884 16 L 865 16" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 16 165 L 16 184 L 35 184" fill="none" stroke="#10B981" stroke-width="3" />
  <path d="M 884 165 L 884 184 L 865 184" fill="none" stroke="#00E5FF" stroke-width="3" />

  <!-- Telemetry Header Status -->
  <g transform="translate(450, 42)" text-anchor="middle">
    <rect x="-180" y="-14" width="360" height="22" rx="11" fill="#030712" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="-160" cy="-3" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="1" fill="#10B981" font-family="'Courier New', 'Fira Code', 'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="3">
      SYSTEM PROTOCOL • ONLINE
    </text>
  </g>

  <!-- Giant Glowing Typography Title -->
  <g transform="translate(450, 110)" text-anchor="middle">
    <!-- Glow Layer -->
    <text x="0" y="0" fill="url(#neonCyan)" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="64" font-weight="900" letter-spacing="14" filter="url(#neonGlow)">
      O L Y X
    </text>
    <!-- Sharp Core Layer -->
    <text x="0" y="0" fill="#FFFFFF" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="64" font-weight="900" letter-spacing="14">
      O L Y X
    </text>
  </g>

  <!-- Architectural Subtitle -->
  <g transform="translate(450, 146)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="'Segoe UI', -apple-system, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" letter-spacing="4">
      CHIEF SYSTEMS ARCHITECT  •  MASTER FULL-STACK ENGINEER
    </text>
  </g>

  <!-- Bottom Terminal Pills -->
  <g transform="translate(450, 175)" text-anchor="middle">
    <text x="0" y="0" fill="#00E5FF" font-family="'Courier New', 'Fira Code', 'Consolas', monospace" font-size="11" font-weight="600" letter-spacing="2">
      [ LOCAL-FIRST ARCHITECTURE ] • [ CLIENT-SIDE RUNTIME ] • [ ZERO-BACKEND ]
    </text>
  </g>
</svg>
